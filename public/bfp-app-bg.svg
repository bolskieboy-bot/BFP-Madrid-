<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="35%" stop-color="#1c2541"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Data Stream Gradients -->
    <linearGradient id="streamBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>

    <linearGradient id="streamOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="50%" stop-color="#fb5607"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>

    <!-- Screen Glow Filter -->
    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00bbf9" flood-opacity="0.35"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffbe0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Atmospheric Background -->
  <rect width="1080" height="1920" fill="url(#bgWall)" />

  <!-- Subtle Blueprint / Grid Lines in Command Center -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="200" x2="1080" y2="200" />
    <line x1="0" y1="400" x2="1080" y2="400" />
    <line x1="0" y1="600" x2="1080" y2="600" />
    <line x1="0" y1="800" x2="1080" y2="800" />
    <line x1="200" y1="0" x2="200" y2="900" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
  </g>

  <!-- ========================================== -->
  <!-- 1. HEADER SECTION (Poster Title & Emblem)  -->
  <!-- ========================================== -->
  <g transform="translate(60, 60)">
    <!-- BFP Shield Emblem -->
    <g transform="translate(40, 20) scale(1.15)">
      <path d="M 40 0 L 80 0 C 80 50 70 85 40 100 C 10 85 0 50 0 0 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
      <!-- Flag Stripes (Blue / Red) -->
      <path d="M 4 8 L 40 8 L 40 50 L 4 50 Z" fill="#1d4ed8"/>
      <path d="M 40 8 L 76 8 L 76 50 L 40 50 Z" fill="#dc2626"/>
      <circle cx="22" cy="28" r="8" fill="#fbbf24"/>
      <!-- Gold Ribbon -->
      <path d="M 10 65 L 70 65 L 60 85 L 20 85 Z" fill="#d97706"/>
    </g>

    <!-- Header Text -->
    <text x="170" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#f8fafc" letter-spacing="3">
      BFP MADRID
    </text>
    <text x="172" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#38bdf8" letter-spacing="2.5">
      EMERGENCY NOTIFIER
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 2. COMMAND CENTER (Top Room & Monitor)     -->
  <!-- ========================================== -->
  <g transform="translate(60, 240)">
    <!-- Big Command Monitor Frame -->
    <rect x="360" y="40" width="620" height="420" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="5" filter="url(#screenGlow)" />
    
    <!-- Monitor Header Bar -->
    <rect x="365" y="45" width="610" height="44" rx="10" fill="#1e293b"/>
    <circle cx="395" cy="67" r="7" fill="#ef4444"/>
    <circle cx="420" cy="67" r="7" fill="#f59e0b"/>
    <circle cx="445" cy="67" r="7" fill="#10b981"/>
    <text x="475" y="73" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#94a3b8">
      📍 Madrid, Surigao del Sur &bull; Operations Grid
    </text>

    <!-- Monitor Map Canvas -->
    <rect x="375" y="95" width="590" height="350" rx="8" fill="#1e293b" />
    <!-- Coastline & Geography of Madrid SDS -->
    <path d="M 375 220 Q 520 180 600 240 T 800 210 Q 900 260 965 240 L 965 445 L 375 445 Z" fill="#0f766e" opacity="0.35"/>
    <path d="M 375 140 Q 550 110 700 160 T 965 130 L 965 445 L 375 445 Z" fill="#0369a1" opacity="0.25"/>

    <!-- Map Grid Roads -->
    <g stroke="#475569" stroke-width="2" opacity="0.7">
      <line x1="420" y1="110" x2="880" y2="410" stroke-width="4" stroke="#64748b"/>
      <line x1="500" y1="380" x2="940" y2="160" stroke-width="3" stroke="#64748b"/>
      <line x1="450" y1="200" x2="750" y2="430" />
      <line x1="620" y1="120" x2="820" y2="390" />
      <circle cx="680" cy="270" r="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/>
      <circle cx="680" cy="270" r="6" fill="#ef4444"/>
    </g>

    <!-- Emergency Incident Pin Callout: INCIDENT AT DISTRICT 3 -->
    <g transform="translate(620, 210)">
      <rect x="-10" y="-35" width="220" height="36" rx="8" fill="#dc2626" stroke="#fca5a5" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="100" y="-12" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        🚨 INCIDENT AT DISTRICT 3
      </text>
      <polygon points="100,1 92,-9 108,-9" fill="#dc2626"/>
    </g>

    <!-- Officer LUMRES (BFP Firefighter in Orange Camo Uniform) -->
    <g transform="translate(30, 20)">
      <!-- Chair Backrest -->
      <rect x="40" y="160" width="130" height="280" rx="20" fill="#0f172a" stroke="#334155" stroke-width="4"/>

      <!-- Body / Uniform (Orange Camo) -->
      <path d="M 90 280 L 190 260 L 260 300 L 280 460 L 70 460 Z" fill="#ea580c"/>
      <!-- Camo Pattern patches -->
      <path d="M 120 310 Q 150 290 140 330 Z" fill="#9a3412"/>
      <path d="M 170 340 Q 200 320 180 370 Z" fill="#c2410c"/>
      <path d="M 100 380 Q 130 360 120 410 Z" fill="#7c2d12"/>

      <!-- Philippine Flag Patch on Sleeve -->
      <rect x="75" y="320" width="34" height="20" rx="3" fill="#1e3a8a" stroke="#fbbf24" stroke-width="1.5"/>
      <polygon points="75,320 90,330 75,340" fill="#ffffff"/>
      <rect x="90" y="320" width="19" height="10" fill="#1e3a8a"/>
      <rect x="90" y="330" width="19" height="10" fill="#b91c1c"/>

      <!-- Name Tag: LUMRES & BFP -->
      <rect x="135" y="330" width="60" height="16" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="165" y="342" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#fef08a" text-anchor="middle">LUMRES</text>
      <rect x="205" y="330" width="40" height="16" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="225" y="342" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">BFP</text>

      <!-- Head & Face (Profile / 3-Quarter View) -->
      <path d="M 140 180 Q 130 250 170 260 Q 210 260 215 190 Q 215 150 170 150 Q 145 150 140 180 Z" fill="#fed7aa"/>
      <!-- Neat Military Haircut -->
      <path d="M 140 175 Q 155 135 195 145 Q 220 155 210 185 Q 185 150 145 165 Z" fill="#1c1917"/>
      <!-- Ear, Nose, Eyebrow, Eyes -->
      <circle cx="150" cy="205" r="9" fill="#fdba74"/>
      <path d="M 185 185 L 200 187" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="195" cy="195" r="3.5" fill="#1c1917"/>
      <path d="M 210 205 L 218 215 L 208 218" fill="none" stroke="#ea580c" stroke-width="2"/>
      <path d="M 195 232 Q 206 235 212 230" fill="none" stroke="#9a3412" stroke-width="2"/>

      <!-- Raised Arm Pointing to District 3 on Wall Monitor -->
      <path d="M 230 300 Q 290 280 340 250 Q 380 230 420 220" fill="none" stroke="#ea580c" stroke-width="42" stroke-linecap="round"/>
      <!-- Hand & Pointing Finger -->
      <path d="M 420 220 L 450 210 L 460 210 L 440 225 L 430 235 Z" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>

      <!-- Tactical Rugged Tablet in Left Hand -->
      <rect x="220" y="340" width="130" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="5"/>
      <rect x="228" y="348" width="114" height="79" rx="4" fill="#0284c7" opacity="0.8"/>
      <!-- Lines on Tablet Display -->
      <line x1="235" y1="365" x2="330" y2="365" stroke="#ffffff" stroke-width="2"/>
      <line x1="235" y1="380" x2="310" y2="380" stroke="#ffffff" stroke-width="2"/>
      <line x1="235" y1="395" x2="280" y2="395" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. CENTER DYNAMIC DATA STREAMS             -->
  <!-- ========================================== -->
  <g>
    <!-- Cyan Neon Stream flowing down to Smartphone & Citizens -->
    <path d="M 720 480 C 720 700, 360 760, 480 1100 C 560 1320, 320 1480, 240 1650"
          fill="none" stroke="url(#streamBlue)" stroke-width="22" stroke-linecap="round" opacity="0.8" filter="url(#screenGlow)"/>
    <path d="M 720 480 C 720 700, 360 760, 480 1100 C 560 1320, 320 1480, 240 1650"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- Orange / Gold Stream flowing to Responders & Families -->
    <path d="M 780 480 C 820 720, 680 850, 780 1150 C 860 1380, 760 1520, 780 1680"
          fill="none" stroke="url(#streamOrange)" stroke-width="16" stroke-linecap="round" opacity="0.75" filter="url(#softGlow)"/>
    <path d="M 780 480 C 820 720, 680 850, 780 1150 C 860 1380, 760 1520, 780 1680"
          fill="none" stroke="#fffbeb" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

    <!-- Floating Circular Dispatch Nodes Along Stream -->
    <!-- Node 1: Photo Incident / Alert -->
    <g transform="translate(680, 660)" filter="url(#dropShadow)">
      <circle cx="0" cy="0" r="32" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
      <!-- Camera / Photo Icon -->
      <path d="M -12 -5 L -8 -11 L 8 -11 L 12 -5 L 16 -5 L 16 12 L -16 12 L -16 -5 Z" fill="#ffffff"/>
      <circle cx="0" cy="3" r="5" fill="#0284c7"/>
    </g>

    <!-- Node 2: GPS Location Pin -->
    <g transform="translate(580, 810)" filter="url(#dropShadow)">
      <circle cx="0" cy="0" r="34" fill="#f59e0b" stroke="#ffffff" stroke-width="3.5"/>
      <!-- Map Pin -->
      <circle cx="0" cy="-6" r="10" fill="#ffffff"/>
      <circle cx="0" cy="-6" r="4" fill="#f59e0b"/>
      <polygon points="0,12 -8,-4 8,-4" fill="#ffffff"/>
    </g>

    <!-- Node 3: SMS Dispatch & Handshake -->
    <g transform="translate(710, 930)" filter="url(#dropShadow)">
      <circle cx="0" cy="0" r="32" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
      <!-- Checkmark & Radio Waves -->
      <path d="M -9 1 L -2 8 L 10 -6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Label: CITIZEN ALERTS -->
    <g transform="translate(240, 950)">
      <rect x="-20" y="-24" width="190" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#dropShadow)"/>
      <text x="75" y="3" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
        CITIZEN ALERTS
      </text>
    </g>

    <!-- Label: BFP COMMAND RESPONSE -->
    <g transform="translate(760, 840)">
      <rect x="-20" y="-24" width="260" height="42" rx="21" fill="#0f172a" stroke="#f59e0b" stroke-width="3" filter="url(#dropShadow)"/>
      <text x="110" y="3" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="1">
        BFP COMMAND RESPONSE
      </text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 4. CENTER SMARTPHONE ALERT RECEIVER        -->
  <!-- ========================================== -->
  <g transform="translate(540, 1140)" filter="url(#screenGlow)">
    <!-- Smartphone Chassis -->
    <rect x="-105" y="-170" width="210" height="340" rx="36" fill="#020617" stroke="#38bdf8" stroke-width="6"/>
    <!-- Phone Screen -->
    <rect x="-95" y="-150" width="190" height="300" rx="24" fill="#0f172a"/>
    
    <!-- Phone Camera Notch -->
    <circle cx="0" cy="-158" r="4" fill="#334155"/>

    <!-- Screen Alert Content -->
    <g transform="translate(0, -60)">
      <!-- Mini BFP Badge -->
      <circle cx="0" cy="-25" r="26" fill="#dc2626" stroke="#fbbf24" stroke-width="3"/>
      <circle cx="0" cy="-25" r="14" fill="#fbbf24"/>
      <rect x="-70" y="20" width="140" height="52" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="middle">
        ALERT: MADRID SDS
      </text>
      <text x="0" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">
        DIST. 3 FIRE - BFP
      </text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 5. CITIZENS RECEIVING ALERTS (Bottom City) -->
  <!-- ========================================== -->
  <g transform="translate(60, 1380)">
    <!-- Distant Madrid Buildings / Palms -->
    <rect x="0" y="200" width="960" height="240" fill="#09101d" opacity="0.6"/>
    <polygon points="120,240 180,180 240,240" fill="#1e293b"/>
    <polygon points="760,240 820,170 880,240" fill="#1e293b"/>
    <line x1="0" y1="440" x2="960" y2="440" stroke="#f8fafc" stroke-width="4" stroke-dasharray="24,18"/>

    <!-- Citizen 1: Elderly Grandfather (Left) -->
    <g transform="translate(100, 40)">
      <circle cx="60" cy="100" r="36" fill="#fed7aa"/>
      <!-- White Hair & Beard -->
      <path d="M 28 90 Q 60 50 92 90 Q 94 135 60 145 Q 26 135 28 90 Z" fill="#e2e8f0" opacity="0.8"/>
      <path d="M 60 70 A 30 30 0 0 1 90 100 L 30 100 Z" fill="#cbd5e1"/>
      <rect x="15" y="150" width="90" height="220" rx="20" fill="#e2e8f0"/>
      <!-- Smartphone in Hand -->
      <rect x="85" y="180" width="40" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="105" cy="212" r="8" fill="#38bdf8"/>
    </g>

    <!-- Citizen 2: Young Woman (Center Left) -->
    <g transform="translate(290, 70)">
      <circle cx="60" cy="110" r="32" fill="#fed7aa"/>
      <!-- Long Dark Hair -->
      <path d="M 24 100 Q 60 60 96 100 Q 102 180 85 220 L 35 220 Q 18 180 24 100 Z" fill="#1e293b"/>
      <rect x="25" y="160" width="70" height="210" rx="16" fill="#fb923c"/>
      <!-- Smartphone -->
      <rect x="68" y="190" width="36" height="60" rx="8" fill="#0f172a" stroke="#00f5d4" stroke-width="3"/>
      <circle cx="86" cy="220" r="6" fill="#00f5d4"/>
    </g>

    <!-- Citizens 3, 4, 5: Family (Father, Mother, Child on Right) -->
    <g transform="translate(560, 50)">
      <!-- Father -->
      <circle cx="100" cy="90" r="34" fill="#fed7aa"/>
      <path d="M 70 70 Q 100 50 130 70 L 130 90 L 70 90 Z" fill="#1e293b"/>
      <rect x="55" y="145" width="90" height="225" rx="18" fill="#10b981"/>
      <rect x="110" y="180" width="38" height="62" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>

      <!-- Mother -->
      <circle cx="210" cy="105" r="32" fill="#fed7aa"/>
      <path d="M 175 90 Q 210 65 245 90 Q 250 160 235 200 L 185 200 Z" fill="#334155"/>
      <rect x="175" y="155" width="75" height="215" rx="18" fill="#ec4899"/>

      <!-- Daughter -->
      <circle cx="165" cy="220" r="26" fill="#fed7aa"/>
      <path d="M 140 210 Q 165 190 190 210 L 190 230 L 140 230 Z" fill="#1e293b"/>
      <rect x="140" y="260" width="50" height="110" rx="12" fill="#facc15"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 6. FOOTER BRANDING STRIP (BFP CLICKS)      -->
  <!-- ========================================== -->
  <g transform="translate(0, 1780)">
    <rect width="1080" height="140" fill="#090d16" />
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#f59e0b" stroke-width="3"/>

    <!-- BFP CLICKS Logo with Arrow -->
    <g transform="translate(420, 20)">
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#0284c7" letter-spacing="1">
        BFP
      </text>
      <text x="75" y="42" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#dc2626" letter-spacing="3">
        CL
      </text>
      <!-- Click Arrow replacing I -->
      <g transform="translate(142, 10)">
        <polygon points="12,0 30,30 20,30 26,45 18,48 12,33 5,38" fill="#00bbf9" stroke="#ffffff" stroke-width="2"/>
      </g>
      <text x="176" y="42" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#dc2626" letter-spacing="3">
        CKS
      </text>
    </g>

    <!-- Tagline -->
    <text x="540" y="105" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="3.5">
      EMERGENCY NOTIFIER: ALWAYS CONNECTED, ALWAYS READY.
    </text>
  </g>
</svg>
